services:
  node-app:
    build: .
    container_name: instagram-clone

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      NODE_ENV: development
      PORT: 3000

      DATABASE_URL: postgresql://amisha26:amisha2602@postgres:5432/instagram_clone

      POSTGRES_PASSWORD: amisha2602
      POSTGRES_USER: amisha26
      POSTGRES_DB: instagram_clone
      
    depends_on:
      - postgres

    networks:
      - app-network

  postgres:
    image: postgres:17.5-alpine
    container_name: instagram-postgres

    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_PASSWORD: amisha2602
      POSTGRES_USER: amisha26
      POSTGRES_DB: instagram_clone

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - app-network

  dbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: instagram-dbeaver

    restart: unless-stopped

    ports:
      - "8080:8978"

    depends_on:
      - postgres

    networks:
      - app-network

networks:
  app-network:

volumes:
  postgres-data: